name: Inkwell CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          cmake-version: 3.22.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Assemble APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Inkwell-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Run Unit Tests
        run: gradle test --continue || true
